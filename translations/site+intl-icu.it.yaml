about.subtitle: DIETRO IL CODICE
about.h3: Chi sono
about.desc: "Sono uno sviluppatore web specializzato nella creazione di interfacce veloci, accessibili e curate nei dettagli. Utilizzo prevalentemente <strong> React </strong>, <strong> Next.js </strong> e <strong> Tailwind CSS </strong> per sviluppare interfacce utente moderne e responsive. A una forte predisposizione per il Frontend affianco competenze lato server in <strong>PHP/Symfony</strong>, che mi permettono di comprendere l''intera architettura dell''applicazione, integrare <strong> API REST </strong> e gestire l'interazione con i database. Cura del codice, attenzione all''esperienza utente e rispetto dei requisiti di accessibilità sono i principi alla base di ogni progetto che realizzo."
