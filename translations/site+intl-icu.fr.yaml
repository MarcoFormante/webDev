about.h3: "Qui suis-je"
about.desc: "Je suis un développeur web spécialisé dans la création d'interfaces rapides, accessibles et soignées dans les moindres détails. J'utilise principalement <strong> React </strong>, <strong> Next.js </strong> et <strong> Tailwind CSS </strong> pour développer des interfaces utilisateur modernes et responsives. À une forte appétence pour le Frontend j'ajoute des compétences côté serveur en <strong>PHP/Symfony</strong>, ce qui me permet de comprendre l'ensemble de l'architecture de l'application, d'intégrer des <strong> API REST </strong> et de gérer l'interaction avec les bases de données. Le soin du code, l'attention portée à l'expérience utilisateur et le respect des exigences d'accessibilité sont les principes qui sous-tendent chaque projet que je réalise."
