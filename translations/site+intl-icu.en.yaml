about.h3: 'Who I am'
about.desc: 'I am a web developer specialized in creating fast, accessible, and carefully crafted interfaces. I mainly use <strong> React </strong>, <strong> Next.js </strong>, and <strong> Tailwind CSS </strong> to build modern, responsive user interfaces. Alongside a strong Frontend focus, I also bring server-side experience in <strong>PHP/Symfony</strong>, which allows me to understand the full application architecture, integrate <strong> REST APIs </strong>, and manage database interactions. Clean code, attention to user experience, and respect for accessibility requirements are the principles behind every project I build.'
